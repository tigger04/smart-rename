# smart-rename YAML configuration file
# Copy this to ~/.config/smart-rename/config.yaml and customise as needed
# All settings here are optional — the script has sensible built-in defaults

# Prompt templates for AI (two-step: classify then name)
# Available placeholders:
#   {{CONTENT}} - The file content
#   {{FILENAME}} - Current filename
#   {{CATEGORY}} - Document category (from classification step)
#   {{BASE_CURRENCY}} - Your base currency
prompt:
  # Step 1: Classify the document type
  classify: |
    Classify this document into exactly one of these categories:
    receipt, invoice, letter, report, medical, bank-statement,
    tax-document, contract, form, manual, correspondence, other

    Output ONLY the category name, nothing else.

    Content:
    {{CONTENT}}

  # Step 2a: General naming (used for all non-receipt/invoice documents)
  template: |
    Generate a concise, descriptive filename for this {{CATEGORY}} (excluding extension).
    Lowercase, hyphens between words, no special characters.
    Be specific: preserve key names and identifying details from the content.
    Never fabricate information not present in the content.
    Output ONLY the filename, nothing else.

    Content:
    {{CONTENT}}

  # Step 2b: Receipt/invoice naming (used ONLY when classified as receipt or invoice)
  receipt: |
    Generate a filename for this {{CATEGORY}} (excluding extension).
    Format: YYYY-MM-DD-amount-description
    The amount must include exactly two decimal places (e.g. 124.50).
    For {{BASE_CURRENCY}} transactions, omit the currency code.
    For other currencies, prefix the amount with the lowercase currency code.
    Examples (assuming base currency is {{BASE_CURRENCY}}):
      - {{BASE_CURRENCY}} receipt: 2026-01-31-124.50-shower-bench
      - USD receipt: 2026-01-31-usd-124.50-shower-bench
      - GBP receipt: 2026-01-31-gbp-89.99-office-supplies
    Lowercase, hyphens. Output ONLY the filename, nothing else.

    Content:
    {{CONTENT}}

# Currency settings
currency:
  base: EUR  # Default currency for receipts/invoices

# AI Provider Configuration
api:
  # Preferred provider order (first available will be used)
  # Options: ollama, openai, claude
  preference:
    - ollama
    - openai
    - claude

  ollama:
    model: smart-rename  # Custom model with tuned parameters (auto-created on first run)
    timeout: 30
    # url: http://localhost:11434  # Uncomment to use remote Ollama

  openai:
    model: gpt-4o
    # API key — can be set here or as OPENAI_API_KEY environment variable
    # key: sk-...

  claude:
    model: claude-3-5-sonnet-20241022
    # API key — can be set here or as CLAUDE_API_KEY environment variable
    # key: sk-ant-...

# Custom abbreviations for common terms
abbreviations:
  svph: "St. Vincent's Private Hospital"
  svuh: "St. Vincent's University Hospital"
  nrh: "National Rehabilitation Hospital"
  mater: "Mater Misericordiae University Hospital"
